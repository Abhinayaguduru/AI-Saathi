<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>AI Saathi Register</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background: linear-gradient(135deg,#0d6efd,#4dabf7);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.register-card{
    width:500px;
    border:none;
    border-radius:20px;
    box-shadow:0px 10px 30px rgba(0,0,0,0.2);
}

</style>

</head>

<body>

<div class="card register-card p-4">

    <div class="text-center">

        <h1>🤖</h1>

        <h2 class="text-primary">
            AI Saathi Registration
        </h2>

    </div>

    <form method="POST">

        <div class="mb-3">
            <label>Name</label>
            <input type="text"
                   name="name"
                   class="form-control"
                   required>
        </div>

        <div class="mb-3">
            <label>Email</label>
            <input type="email"
                   name="email"
                   class="form-control"
                   required>
        </div>

        <div class="mb-3">
            <label>Password</label>
            <input type="password"
                   name="password"
                   class="form-control"
                   required>
        </div>

        <button class="btn btn-success w-100">
            Register
        </button>

    </form>

    <hr>

    <div class="text-center">

        <a href="/"
           class="btn btn-outline-primary">

           Back to Login

        </a>

    </div>

</div>

</body>
</html>

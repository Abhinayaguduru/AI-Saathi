<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>AI Saathi Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background: linear-gradient(135deg,#0d6efd,#4dabf7);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.login-card{
    width:450px;
    border:none;
    border-radius:20px;
    box-shadow:0px 10px 30px rgba(0,0,0,0.2);
}

.logo{
    font-size:50px;
}

</style>

</head>

<body>

<div class="card login-card p-4">

    <div class="text-center">

        <h1 class="logo">🤖</h1>

        <h2 class="text-primary">
            AI Saathi
        </h2>

        <p class="text-muted">
            Your Personal Government Scheme Assistant
        </p>

    </div>

    <form action="/login" method="POST">

        <div class="mb-3">

            <label>Email</label>

            <input
                type="email"
                name="email"
                class="form-control"
                required>

        </div>

        <div class="mb-3">

            <label>Password</label>

            <input
                type="password"
                name="password"
                class="form-control"
                required>

        </div>

        <button
            type="submit"
            class="btn btn-primary w-100">

            Login

        </button>

    </form>

    <hr>

    <div class="text-center">

        <p>
            New User?
        </p>

        <a href="/register"
           class="btn btn-outline-primary">

           Create Account

        </a>

    </div>

</div>

</body>
</html>
